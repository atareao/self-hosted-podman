# Configuración Estática
global:
  checkNewVersion: false
  sendAnonymousUsage: false
    
log:
  level: INFO
  format: json
      
accessLog:
  filePath: "" # Vacio para volcar a stdout/journald
  format: json
  filters:
    statusCodes:
       - "400-499" # Captura errores de autenticación y accesos no autorizados
api:
  dashboard: false
  insecure: false

ping:
  entryPoint: healthcheck

# Desactivar protocolos TLS antiguos (Solo TLS 1.2 y 1.3)
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_AES_128_GCM_SHA256
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256

entryPoints:
  web:
    address: 0.0.0.0:80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: 0.0.0.0:443
    http:
      tls: {}
    http3: true
    # Optimización: Mantener conexiones abiertas para mejorar performance
    transport:
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 60s
        idleTimeout: 180s

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic/
    watch: true

certificatesResolvers:
  cloudflare:
    acme:
      email: tu-email@atareao.es
      storage: /etc/traefik/acme.json
      dnsChallenge:
        provider: cloudflare
        propagation:
          delayBeforeChecks: 10s
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

experimental:
  plugins:
    traefik-oidc-auth:
      moduleName: "github.com/sevensolutions/traefik-oidc-auth"
      version: "v0.22.0"
    crowdsec:
      moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      version: "v1.8.1"
