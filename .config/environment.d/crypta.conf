# Entorno que necesita el driver de secretos "shell" de Podman (crypta -> sops).
#
# El healthcheck automatico de Podman (cuando un quadlet define HealthCmd) NO lo
# ejecuta conmon: Podman lo lanza como unit transitoria
#   systemd-run --user ... podman healthcheck run <ctr>
# que SOLO hereda el entorno del systemd user manager. Si ese entorno no incluye
# ~/.local/bin (donde viven crypta y sops) ni SOPS_AGE_KEY_FILE, el driver no
# puede re-resolver los secretos type=env y Podman falla con:
#   Error: <id>: no such secret
# dejando el contenedor unhealthy (y la unit stuck en arranque en frio).
#
# Tras editar este fichero: systemctl --user daemon-reexec
PATH=$PATH:$HOME/.local/bin
SOPS_AGE_KEY_FILE=$HOME/.secrets/sops/age/key.txt
