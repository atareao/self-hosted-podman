data_dir: "/var/lib/vector"

api:
  enabled: true
  address: "0.0.0.0:8686"

# --- SOURCES ---
sources:
  podman_hybrid:
    type: "docker_logs"

# --- TRANSFORMS ---
transforms:
  process_traefik:
    type: "remap"
    inputs:
      - "podman_hybrid"
    source: |
      # Filtramos por el nombre del contenedor que viene del socket
      if .container_name == "traefik" {
          parsed, err = parse_json(.message)
          if err == null {
              . = merge!(., parsed)
              del(.message)
          }
          .service_type = "edge-proxy"
      }

      # Añadimos metadatos del host y eliminamos basura
      .host_node = "${HOSTNAME:-desconocido}"
      del(.image)

# --- SINKS ---
# Las credenciales las inyecta la unidad (vector.container) como entorno:
#   - OO_USER_EMAIL  -> EnvironmentFile=.config/vector/vector.env   (NO secreto)
#   - OO_USER_PASSWORD -> Secret=openobserve_root_password          (mismo secret que OpenObserve)
sinks:
  openobserve:
    type: "http"
    inputs:
      - "process_traefik"
    # URI fija: el sink `http` de Vector no interpola campos por evento (${.container_name} no
    # se sustituye y genera una ruta inválida), así que todas las líneas van al stream `vector`.
    uri: "http://openobserve:5080/api/default/vector/_json"
    auth:
      strategy: "basic"
      user: "${OO_USER_EMAIL}"
      password: "${OO_USER_PASSWORD}"
    encoding:
      codec: "json"

