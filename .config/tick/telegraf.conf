# Telegraf configuration for the `tick` stack.
#
# Origen: ../self-hosted/tick/telegraf.conf (sample completo de Telegraf),
# recortado a los bloques activos para que el fichero sea legible.
#
# La interpolación es la nativa de Telegraf: ${VAR} se sustituye desde el
# entorno del contenedor. En este stack:
#   - DOCKER_INFLUXDB_INIT_ORG / DOCKER_INFLUXDB_INIT_BUCKET  -> .config/tick/tick.env
#   - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN -> Secret=influxdb_admin_token (tick-telegraf.container)
# Los secretos NO se escriben en este fichero.

# Global tags can be specified here in key="value" format.
[global_tags]
  # dc = "us-east-1" # will tag all metrics with dc=us-east-1

# Configuration for telegraf agent
[agent]
  ## Default data collection interval for all inputs
  interval = "10s"
  ## Rounds collection interval to 'interval'
  round_interval = true

  ## Telegraf will send metrics to outputs in batches of at most
  ## metric_batch_size metrics.
  metric_batch_size = 1000

  ## Maximum number of unwritten metrics per output.
  metric_buffer_limit = 10000

  ## Collection jitter is used to jitter the collection by a random amount.
  collection_jitter = "0s"

  ## Default flushing interval for all outputs.
  flush_interval = "10s"

  ## Jitter the flush interval by a random amount.
  flush_jitter = "0s"

  ## Run telegraf with a user defined precision.
  precision = ""

  ## Override default hostname, if empty use os.Hostname()
  hostname = ""
  ## If set to true, do no set the "host" tag in the telegraf agent.
  omit_hostname = false

# Configuration for sending metrics to InfluxDB 2.x (native ${VAR} interpolation)
[[outputs.influxdb_v2]]
  ## The URLs of the InfluxDB cluster nodes.
  urls = ["http://influxdb:8086"]

  ## Token for authentication (injected from the Podman secret).
  token = "${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}"

  ## Organization is the name of the organization you wish to write to; must exist.
  organization = "${DOCKER_INFLUXDB_INIT_ORG}"

  ## Destination bucket to write into.
  bucket = "${DOCKER_INFLUXDB_INIT_BUCKET}"


#                            INPUT PLUGINS                                    #
###############################################################################

# Read metrics about cpu usage
[[inputs.cpu]]
  ## Whether to report per-cpu stats or not
  percpu = true
  ## Whether to report total system cpu stats or not
  totalcpu = true
  ## If true, collect raw CPU time metrics
  collect_cpu_time = false
  ## If true, compute and report the sum of all non-idle CPU states
  report_active = false

# Read metrics about disk usage by mount point
[[inputs.disk]]
  ## Ignore mount points by filesystem type.
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# Read metrics about disk IO by device
[[inputs.diskio]]

# Get kernel statistics from /proc/stat
[[inputs.kernel]]

# Read metrics about memory usage
[[inputs.mem]]

# Get the number of processes and group them by status
[[inputs.processes]]

# Read metrics about swap memory usage
[[inputs.swap]]

# Read metrics about system load & uptime
[[inputs.system]]

# Read metrics about docker containers (Podman socket mounted as /var/run/docker.sock)
[[inputs.docker]]
  ## Docker/Podman endpoint (rootless Podman usa la misma ruta del socket).
  endpoint = "unix:///var/run/docker.sock"
  source_tag = false
  container_name_include = []
  container_name_exclude = []
  ## Solo contenedores en ejecucion.
  container_state_include = ["running"]
  ## Timeout for docker list, info, and stats commands
  timeout = "5s"
  perdevice_include = ["cpu"]
  total_include = ["cpu", "blkio", "network"]
