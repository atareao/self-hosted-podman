# ---------------------------------------------------------------------------
# Config del stack `unbound` (repo self-hosted-podman).
#
# La imagen `docker.io/mvance/unbound` NO lee `unbound.conf.d/`: su script de
# arranque (/unbound.sh) GENERA /opt/unbound/etc/unbound/unbound.conf si no
# existe, y lo único que incluye por defecto es:
#     include: /opt/unbound/etc/unbound/a-records.conf
#     include: /opt/unbound/etc/unbound/srv-records.conf
#     include: /opt/unbound/etc/unbound/forward-records.conf
#
# Por eso este fichero se monta como `forward-records.conf`: es el punto de
# extensión documentado por la imagen para personalizar unbound SIN sustituir
# su `unbound.conf`. Al dejar la `forward-zone` comentada, unbound deja de
# reenviar a Cloudflare (comportamiento por defecto de la imagen) y pasa a
# resolver por RECURSIÓN, que es el motivo de desplegarlo.
#
# Nota: el fichero se anida dentro de la cláusula `server:` del unbound.conf
# generado, de ahí que empiece por `server:`.
# ---------------------------------------------------------------------------

server:
    # Nivel de log: 0 = solo errores (por defecto de la imagen), 1 = operativo.
    verbosity: 1

    # interface/port se dejan como los trae la imagen (`interface: 0.0.0.0@53`).
    # NO se repiten aquí a propósito: `interface` es acumulativo y declararlo
    # otra vez hace fallar `unbound-checkconf` ("interface ... present twice").
    # El contenedor escucha en el 53 interno; en el host se publica en 5353
    # (Podman rootless no puede enlazar puertos < 80).

    # Registros locales de ejemplo: descomentar y adaptar para resolver nombres
    # del LAN con este unbound.
    # local-zone: "lan." static
    # local-data: "router.lan. A 192.168.1.1"

# Forwarders públicos: a propósito DESACTIVADOS (unbound resuelve por recursión,
# que es el motivo de desplegarlo). Descomentar para reenviar a un resolver
# público; en ese caso unbound deja de ser recursivo.
# forward-zone:
#     name: "."
#     forward-tls-upstream: yes
#     forward-addr: 1.1.1.1@853#cloudflare-dns.com
#     forward-addr: 1.0.0.1@853#cloudflare-dns.com
